spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification-service}
    username: ${DB_USERNAME:transaction-core}
    password: ${DB_PASSWORD:transaction-core-123}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${NOTIFICATION_SERVICE_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info