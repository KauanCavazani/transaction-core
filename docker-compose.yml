services:
  postgres:
    image: postgres:16
    container_name: transaction-core-postgres
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: account-service
      POSTGRES_USER: transaction-core
      POSTGRES_PASSWORD: transaction-core-123
    ports:
      - "5432:5432"
    volumes:
      - transaction-core_postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transaction-core"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: transaction-core-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: transaction-core-kafka
    ports:
      - "9092:9092"
    volumes:
      - transaction-core_kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: transaction-core-kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9093

  kafka-connect:
    image: quay.io/debezium/connect:2.7
    container_name: transaction-core-kafka-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8085:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9093
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 30

  debezium-connector-setup:
    image: curlimages/curl:latest
    container_name: transaction-core-debezium-setup
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./docker:/docker
    environment:
      KAFKA_CONNECT_URL: http://kafka-connect:8083
    entrypoint: ["/bin/sh", "/docker/register-debezium-connectors.sh"]
    restart: "no"

volumes:
  transaction-core_postgres_data:
  transaction-core_kafka_data: